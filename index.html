
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.json"><title>Othithi Bird</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:Arial;background:#65d8ff;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,scale;
function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
 scale=devicePixelRatio;
}
resize();
onresize=resize;

let bird, pipes, score, best=Number(localStorage.getItem("othithiBest")||0);
let state="menu", frame=0, clouds=[];

function reset(){
 bird={x:W*.25,y:H*.45,vy:0,angle:0};
 pipes=[];
 score=0;
 frame=0;
 state="playing";
}

for(let i=0;i<6;i++){
 clouds.push({x:Math.random()*2000,y:Math.random()*H*.55,
 size:30+Math.random()*30});
}

function drawCloud(x,y,s){
 ctx.fillStyle="rgba(255,255,255,.85)";
 ctx.beginPath();
 ctx.arc(x,y,s*.5,0,Math.PI*2);
 ctx.arc(x+s*.45,y-s*.25,s*.65,0,Math.PI*2);
 ctx.arc(x+s,y,s*.5,0,Math.PI*2);
 ctx.fill();
}

function background(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#48c9ff");
 g.addColorStop(1,"#d7f8ff");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 clouds.forEach(c=>{
 drawCloud(c.x,c.y,c.size);
 if(state==="playing")c.x-=1.2*scale;
 if(c.x<-100*scale)c.x=W+100*scale;
 });

 ctx.fillStyle="#8de06a";
 ctx.beginPath();
 ctx.moveTo(0,H*.84);
 ctx.quadraticCurveTo(W*.3,H*.69,W*.6,H*.83);
 ctx.quadraticCurveTo(W*.8,H*.7,W,H*.82);
 ctx.lineTo(W,H);ctx.lineTo(0,H);
 ctx.fill();

 ctx.fillStyle="#56bb4d";
 ctx.fillRect(0,H*.9,W,H*.1);
}

function drawPipe(p){
 let grad=ctx.createLinearGradient(p.x,0,p.x+60*scale,0);
 grad.addColorStop(0,"#168a36");
 grad.addColorStop(.5,"#54df58");
 grad.addColorStop(1,"#08742a");
 ctx.fillStyle=grad;

 ctx.fillRect(p.x,0,p.w,p.top);
 ctx.fillRect(p.x,p.top+ p.gap,p.w,H);

 ctx.fillStyle="#168c37";
 ctx.fillRect(p.x-5*scale,p.top-20*scale,p.w+10*scale,20*scale);
 ctx.fillRect(p.x-5*scale,p.top+p.gap,p.w+10*scale,20*scale);
}

function drawBird(){
 ctx.save();
 ctx.translate(bird.x,bird.y);
 ctx.rotate(bird.angle);

 // Body
 ctx.fillStyle="#ffcc35";
 ctx.beginPath();
 ctx.ellipse(0,0,22*scale,17*scale,0,0,Math.PI*2);
 ctx.fill();

 // Wing
 ctx.fillStyle="#f39c12";
 ctx.beginPath();
 ctx.ellipse(-7*scale,5*scale,12*scale,7*scale,-.3,0,Math.PI*2);
 ctx.fill();

 // Eye
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(9*scale,-7*scale,7*scale,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#222";
 ctx.beginPath();
 ctx.arc(12*scale,-7*scale,3*scale,0,Math.PI*2);
 ctx.fill();

 // Beak
 ctx.fillStyle="#ff792c";
 ctx.beginPath();
 ctx.moveTo(17*scale,0);
 ctx.lineTo(30*scale,5*scale);
 ctx.lineTo(17*scale,9*scale);
 ctx.fill();

 ctx.restore();
}

function text(t,y,size,color="white"){
 ctx.textAlign="center";
 ctx.font=`bold ${size*scale}px Arial`;
 ctx.fillStyle=color;
 ctx.shadowColor="#333";
 ctx.shadowBlur=4*scale;
 ctx.fillText(t,W/2,y);
 ctx.shadowBlur=0;
}

function draw(){
 frame++;
 background();

 if(state==="playing"){
 bird.vy+=.42*scale;
 bird.y+=bird.vy;
 bird.angle=Math.min(.8,bird.vy*.08);

 if(frame%95===0){
 let gap=H*.27;
 let top=H*.12+Math.random()*(H*.40);
 pipes.push({x:W,w:65*scale,top,gap,passed:false});
 }

 pipes.forEach(p=>{
 p.x-=3.2*scale;
 drawPipe(p);

 if(!p.passed&&p.x+p.w<bird.x){
 score++;
 p.passed=true;
 if(score>best){
 best=score;
 localStorage.setItem("othithiBest",best);
 }
 }

 if(bird.x+15*scale>p.x&&bird.x-15*scale<p.x+p.w&&
 (bird.y-13*scale<p.top||bird.y+13*scale>p.top+p.gap)){
 state="over";
 }
 });

 pipes=pipes.filter(p=>p.x>-100*scale);

 if(bird.y>H*.89||bird.y<0)state="over";
 }

 if(state!=="menu")drawBird();

 // Score panel
 ctx.fillStyle="rgba(0,0,0,.2)";
 ctx.beginPath();
 ctx.roundRect(W/2-65*scale,25*scale,130*scale,55*scale,15*scale);
 ctx.fill();
 text(score,65,32);

 if(state==="menu"){
 text("OTHITHI BIRD",H*.28,38);
 text("TAP TO FLY",H*.48,22);
 text("BEST: "+best,H*.57,19);
 }

 if(state==="over"){
 ctx.fillStyle="rgba(0,0,0,.55)";
 ctx.fillRect(0,0,W,H);
 text("GAME OVER",H*.35,38);
 text("SCORE: "+score,H*.44,25);
 text("BEST: "+best,H*.51,22);

 ctx.fillStyle="#ffb52e";
 ctx.beginPath();
 ctx.roundRect(W/2-85*scale,H*.59,170*scale,55*scale,15*scale);
 ctx.fill();
 text("RESTART",H*.59+36*scale,22,"#fff");
 }

 requestAnimationFrame(draw);
}

function action(){
 if(state==="menu")reset();
 else if(state==="over")reset();
 else bird.vy=-7.5*scale;
}

canvas.addEventListener("pointerdown",action);
document.addEventListener("keydown",e=>{
 if(e.code==="Space"||e.code==="ArrowUp")action();
});

draw();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
